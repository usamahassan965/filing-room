# Two services, both stateful, both needed from M0 onward.
#   phoenix -> trace collector + UI at http://localhost:6006
#   qdrant  -> vector store, pinned so the version that produced a result is the
#              version recorded in the result. Kept in step with qdrant-client:
#              the client refuses a server more than a minor version away, and
#              a warning that says "incompatible" is not a thing to live with.
services:
  phoenix:
    image: arizephoenix/phoenix:version-11.9.0
    container_name: filing-phoenix
    ports:
      - "6006:6006"   # UI + OTLP/HTTP collector (/v1/traces)
      - "4317:4317"   # OTLP/gRPC collector
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - ./phoenix_data:/mnt/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: filing-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # ------------------------------------------------------------------ the app
  # Behind a profile, so `docker compose up -d` still means "start the two
  # stores" for anyone developing against a local checkout. The demo is
  #
  #     docker compose --profile app up -d --build
  #
  # and it needs two things this repository cannot carry: a GEMINI_API_KEY in
  # .env, and a built corpus under ./data (see README -- `filing ingest`, then
  # `filing index`). Both are mounted rather than baked; see Dockerfile.
  api:
    profiles: ["app"]
    build: .
    image: filing-api
    container_name: filing-api
    env_file: .env
    environment:
      # Service names, not localhost: inside the compose network `localhost` is
      # the container itself, and the defaults in config.py are written for a
      # laptop where every service shares one loopback.
      QDRANT_URL: http://qdrant:6333
      PHOENIX_ENDPOINT: http://phoenix:6006
    volumes:
      - ./data:/app/data:ro
    ports:
      # Loopback only. /ask has no authentication and spends a model budget on
      # every request; publishing it on 0.0.0.0 would put that on the LAN.
      - "127.0.0.1:8077:8000"
    depends_on:
      - qdrant
      - phoenix
    restart: unless-stopped

  ui:
    profiles: ["app"]
    build: .
    image: filing-api
    container_name: filing-ui
    environment:
      FILING_API: http://api:8000
    command:
      - streamlit
      - run
      - src/filing/ui.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
    restart: unless-stopped
