[project]
name = "filing"
version = "0.1.0"
description = "Agentic RAG over SEC filings: XBRL facts, filing text, and an entity graph behind one evidence contract."
requires-python = ">=3.11"
readme = "README.md"

# Keep this list honest about what the code currently imports; each gate
# appends its own.
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-openai>=0.1.18",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    # Local cross-encoder reranking. Gemini serves no reranker, so this is not
    # optional on the default backend. Pulls torch; on Linux, install the CPU
    # wheel first (see README) or pip drags in ~2.5GB of CUDA you cannot use.
    "sentence-transformers>=3.0",
    # M1. The manifest is DuckDB because the corpus questions are SQL questions
    # ("how many 10-Ks per company?") and it needs no server; universe.yaml is
    # YAML because it is a file a human edits to change the scope of the project.
    "duckdb>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
# The Phoenix *server*, for running the collector without Docker. The runtime
# only needs arize-phoenix-otel (the client), which is in dependencies above --
# this pulls pandas, fastapi, boto3 and friends, so it stays opt-in.
phoenix = [
    "arize-phoenix>=8.0",
]

[project.scripts]
filing = "filing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
